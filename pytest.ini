[pytest]
pythonpath = .
# File order matters: UI scenarios produce transcripts, then DeepEval judges them.
testpaths =
    tests/test_resume_agent.py
    tests/test_deepeval.py
addopts = -ra -m "not dynamic and not smoke" -p no:cacheprovider
markers =
    test_id(id): links an automated test to a manual test case (e.g. TC_001)
    ui: Playwright end-to-end UI test
    evaluation: DeepEval LLM-as-a-Judge evaluation of captured agent responses
    positive: positive scenario
    negative: negative scenario
    boundary: boundary scenario
    dynamic: supplementary test using Ollama-generated inputs (run with -m dynamic)
    smoke: DeepEval/Ollama setup smoke test (run with -m smoke)
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-7s | %(name)s | %(message)s
filterwarnings =
    ignore::DeprecationWarning
